[project]
name = "retailq"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=artifacts/pytest-tmp"
markers = ["mysql: requires the isolated retailq_test MySQL instance on port 3307", "lite: uses a real isolated Milvus Lite local directory"]
